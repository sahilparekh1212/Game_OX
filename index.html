<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>OX aka Tic Tac Toe</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden; /* no horizontal or vertical scrollbars */
      }
      body {
        margin: 0;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at 50% 0%, #1b2a4a 0%, #0a0f1e 60%);
        color: #e8eefc;
        user-select: none;
        -webkit-user-select: none;
        padding: 14px 12px;
        overscroll-behavior: none;
      }
      h1 {
        margin: 0;
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: #9fd0ff;
      }
      .h1-sub {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 2.5px;
        color: #7d8bab;
      }

      /* Setup panel — title over tiles */
      .panel {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 22px;
        align-items: flex-start;
        justify-content: center;
        padding: 10px 16px;
        background: rgba(20, 30, 54, 0.6);
        border: 1px solid rgba(159, 208, 255, 0.15);
        border-radius: 12px;
      }
      .group {
        display: flex;
        flex-direction: column;
        gap: 5px;
        align-items: flex-start;
      }
      .group .label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.4px;
        color: #7d8bab;
      }
      .seg {
        display: inline-flex;
        background: #101a30;
        border-radius: 8px;
        padding: 3px;
        gap: 3px;
      }
      .seg button {
        appearance: none;
        border: none;
        background: transparent;
        color: #aebbd6;
        font: inherit;
        font-size: 13px;
        padding: 5px 12px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.12s, color 0.12s;
      }
      .seg button:hover {
        color: #e8eefc;
      }
      .seg button.active {
        background: #3a6df0;
        color: #ffffff;
      }

      /* Game area: score sidebar beside the board on wide screens */
      .layout {
        display: flex;
        align-items: center; /* sidebar centres vertically against the board */
        justify-content: center;
        gap: 26px;
        min-height: 0;
      }
      .side {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 118px;
        flex: none;
      }
      .score {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        padding: 12px 10px 10px;
        background: rgba(20, 30, 54, 0.6);
        border: 1px solid rgba(159, 208, 255, 0.12);
        border-top: 3px solid rgba(159, 208, 255, 0.35);
        border-radius: 12px;
      }
      .score.x {
        border-top-color: #6fb1ff;
      }
      .score.o {
        border-top-color: #ff8a5c;
      }
      .score-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #7d8bab;
        text-align: center;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .score-val {
        font-size: 26px;
        font-weight: 700;
        line-height: 1;
      }
      .score.x .score-val {
        color: #6fb1ff;
      }
      .score.o .score-val {
        color: #ff8a5c;
      }
      .ctrl-btn {
        appearance: none;
        border: 1px solid rgba(159, 208, 255, 0.25);
        background: #1a2848;
        color: #dce7ff;
        font: inherit;
        font-size: 13px;
        padding: 8px 14px;
        border-radius: 9px;
        cursor: pointer;
        touch-action: manipulation;
        width: 100%;
      }
      .ctrl-btn:hover {
        background: #223662;
      }
      .ctrl-btn:active {
        transform: translateY(1px);
      }
      .ctrl-btn.ghost {
        background: transparent;
      }

      .main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        min-height: 0;
      }
      .status {
        font-size: 17px;
        font-weight: 600;
        color: #cfe0ff;
        min-height: 22px;
      }
      .status.over {
        color: #8effc4;
      }

      /* Player name inputs (2-player mode) */
      .names {
        display: flex;
        gap: 6px;
      }
      .names input {
        width: 104px;
        padding: 6px 9px;
        border-radius: 8px;
        border: 1px solid rgba(159, 208, 255, 0.2);
        background: #101a30;
        color: #e8eefc;
        font: inherit;
        font-size: 13px;
        user-select: text;
        -webkit-user-select: text;
      }
      .names input:focus {
        outline: none;
        border-color: #3a6df0;
      }

      /* End-of-round popup */
      .end-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: rgba(6, 10, 22, 0.74);
        border-radius: 14px;
        z-index: 6;
      }
      .end-overlay[hidden] {
        display: none;
      }
      .end-title {
        font-size: 24px;
        font-weight: 700;
        color: #e8eefc;
        text-align: center;
        padding: 0 12px;
      }
      .end-actions {
        display: flex;
        gap: 10px;
      }
      .end-actions .ctrl-btn {
        width: auto;
      }

      /* Coin flip animation */
      .board-wrap {
        position: relative;
      }
      .coin-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(6, 10, 22, 0.62);
        border-radius: 14px;
        z-index: 5;
        perspective: 600px;
      }
      .coin-overlay[hidden] {
        display: none;
      }
      .coin {
        width: 96px;
        height: 96px;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 1.15s cubic-bezier(0.25, 0.65, 0.3, 1);
      }
      .coin-face {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 19px;
        letter-spacing: 1px;
        backface-visibility: hidden;
      }
      .coin-front {
        background: radial-gradient(circle at 35% 30%, #ffe9a8, #f5c542 55%, #c99a1f);
        color: #5c4404;
        box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.25), 0 6px 18px rgba(0, 0, 0, 0.5);
      }
      .coin-back {
        transform: rotateY(180deg);
        background: radial-gradient(circle at 35% 30%, #dfe9ff, #9db4e8 55%, #5c78b8);
        color: #1c2c55;
        box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.25), 0 6px 18px rgba(0, 0, 0, 0.5);
      }

      /* Board — sized against the viewport so the page never scrolls */
      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 10px;
        width: clamp(220px, min(46vw, 100dvh - 250px), 400px);
        aspect-ratio: 1 / 1;
      }
      .cell {
        appearance: none;
        border: none;
        border-radius: 14px;
        background: #172444;
        color: #e8eefc;
        font-size: clamp(30px, 9vh, 72px);
        font-weight: 700;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: inset 0 0 0 1px rgba(159, 208, 255, 0.08);
        transition: background 0.12s, transform 0.04s;
        touch-action: manipulation;
      }
      .cell:hover:not(:disabled) {
        background: #1e2f57;
      }
      .cell:active:not(:disabled) {
        transform: scale(0.97);
      }
      .cell:disabled {
        cursor: default;
      }
      .cell.x {
        color: #6fb1ff;
      }
      .cell.o {
        color: #ff8a5c;
      }
      .cell.win {
        background: #2b4a86;
        box-shadow: 0 0 0 2px rgba(159, 208, 255, 0.55), 0 0 22px rgba(111, 177, 255, 0.35);
      }
      /* 4×4: tighter gaps and smaller marks so the board stays the same size */
      .board.size-4 {
        gap: 8px;
      }
      .board.size-4 .cell {
        font-size: clamp(20px, 6.5vh, 48px);
        border-radius: 10px;
      }

      /* Narrow screens: scores + actions collapse into one inline row above the grid */
      @media (max-width: 640px) {
        body {
          padding: 10px 10px;
          gap: 10px;
        }
        .layout {
          flex-direction: column;
          align-items: center;
          gap: 10px;
        }
        .side {
          flex-direction: row;
          flex-wrap: wrap;
          justify-content: center;
          align-items: stretch;
          width: auto;
          gap: 8px;
        }
        .score {
          gap: 1px;
          padding: 6px 12px 5px;
          min-width: 72px;
        }
        .score-val {
          font-size: 18px;
        }
        h1 {
          font-size: 18px;
          letter-spacing: 4px;
        }
        .h1-sub {
          font-size: 10px;
          letter-spacing: 2px;
        }
        .board {
          width: clamp(200px, min(88vw, 100dvh - 330px), 400px);
        }
        .cell {
          font-size: clamp(26px, 12vw, 64px);
        }
      }
    </style>
  </head>
  <body>
    <h1>OX <span class="h1-sub">aka Tic Tac Toe</span></h1>

    <div class="panel">
      <div class="group">
        <span class="label">Mode</span>
        <div class="seg" id="mode">
          <button data-mode="cpu" class="active">vs Computer</button>
          <button data-mode="two">2 Players</button>
        </div>
      </div>

      <div class="group">
        <span class="label">Board</span>
        <div class="seg" id="size">
          <button data-size="3" class="active">3×3</button>
          <button data-size="4">4×4</button>
        </div>
      </div>

      <div class="group" id="group-diff">
        <span class="label">Difficulty</span>
        <div class="seg" id="difficulty">
          <button data-diff="easy">Easy</button>
          <button data-diff="medium" class="active">Medium</button>
          <button data-diff="hard">Hard</button>
        </div>
      </div>

      <div class="group" id="group-mark">
        <span class="label">Play as</span>
        <div class="seg" id="mark">
          <button data-mark="X" class="active">X</button>
          <button data-mark="O">O</button>
        </div>
      </div>

      <div class="group" id="group-starter">
        <span class="label">First move</span>
        <div class="seg" id="starter">
          <button data-starter="flip" class="active">🪙 Flip</button>
          <button data-starter="human">You</button>
          <button data-starter="ai">CPU</button>
        </div>
      </div>

      <div class="group" id="group-names" style="display: none">
        <span class="label">Players</span>
        <div class="names">
          <input id="nameX" type="text" maxlength="12" placeholder="Player X" autocomplete="off" />
          <input id="nameO" type="text" maxlength="12" placeholder="Player O" autocomplete="off" />
        </div>
      </div>
    </div>

    <div class="layout">
      <aside class="side">
        <div class="score x">
          <span class="score-label" id="labelX">You (X)</span>
          <span class="score-val" id="scoreX">0</span>
        </div>
        <div class="score draw">
          <span class="score-label">Draws</span>
          <span class="score-val" id="scoreDraw">0</span>
        </div>
        <div class="score o">
          <span class="score-label" id="labelO">CPU (O)</span>
          <span class="score-val" id="scoreO">0</span>
        </div>
      </aside>

      <div class="main">
        <div class="status" id="status">Your turn</div>
        <div class="board-wrap">
          <div class="board" id="board"></div>
          <div class="coin-overlay" id="coin-overlay" hidden>
            <div class="coin" id="coin">
              <div class="coin-face coin-front">YOU</div>
              <div class="coin-face coin-back">CPU</div>
            </div>
          </div>
          <div class="end-overlay" id="end-overlay" hidden>
            <div class="end-title" id="end-title"></div>
            <div class="end-actions">
              <button id="po-new" class="ctrl-btn">New Game</button>
              <button id="po-reset" class="ctrl-btn ghost">Reset Score</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
